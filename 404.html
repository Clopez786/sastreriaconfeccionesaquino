<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
        /* SPA for GitHub Pages */
        var segmentCount = 1; // repo path has 1 segment
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' +
            l.pathname.split('/').slice(1, 1 + segmentCount).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(segmentCount).join('/') +
            (l.search ? '&' + l.search.slice(1) : '') + l.hash
        );
    </script>
</head>

<body></body>

</html>
